name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows MSI and publish release
    runs-on: windows-latest

    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analyzer/requirements.txt

      - name: Install Python analyzer dependencies
        run: |
          pip install -r analyzer/requirements.txt
          pip install "pyinstaller>=6.3.0"

      - name: Ensure sidecar output directory exists
        shell: bash
        run: mkdir -p src-tauri/binaries

      - name: Build Python analyzer as Tauri sidecar
        run: pyinstaller --onefile --name analyzer-x86_64-pc-windows-msvc --distpath src-tauri/binaries analyzer/main.py

      - name: Build Tauri app (MSI + NSIS + updater artefacts)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Collect release artefacts
        id: collect
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p release-artefacts
          bundle_root="src-tauri/target/release/bundle"
          # Tauri 2.x with bundle.createUpdaterArtifacts: true produces the
          # NSIS updater archive (.nsis.zip) on Windows; the MSI is shipped
          # as a one-time installer only, no .msi.zip. Globs are best-effort.
          shopt -s nullglob
          for f in \
            "$bundle_root"/msi/*.msi \
            "$bundle_root"/nsis/*.exe \
            "$bundle_root"/nsis/*.nsis.zip \
            "$bundle_root"/nsis/*.nsis.zip.sig ; do
            cp "$f" release-artefacts/
          done
          echo "--- release-artefacts/ ---"
          ls -la release-artefacts/
          # The updater consumes the signed NSIS zip + its .sig.
          nsis_zip=$(ls release-artefacts/*.nsis.zip 2>/dev/null | head -n1 || true)
          nsis_sig=$(ls release-artefacts/*.nsis.zip.sig 2>/dev/null | head -n1 || true)
          nsis_zip_name=$(basename "$nsis_zip" 2>/dev/null || echo "")
          echo "updater_archive_path=$nsis_zip" >> "$GITHUB_OUTPUT"
          echo "updater_sig_path=$nsis_sig" >> "$GITHUB_OUTPUT"
          echo "updater_archive_name=$nsis_zip_name" >> "$GITHUB_OUTPUT"

      - name: Generate updater manifest (latest.json)
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
          REPO: ${{ github.repository }}
          UPDATER_ARCHIVE_NAME: ${{ steps.collect.outputs.updater_archive_name }}
          UPDATER_SIG_PATH: ${{ steps.collect.outputs.updater_sig_path }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATER_ARCHIVE_NAME" ] || [ -z "$UPDATER_SIG_PATH" ]; then
            echo "ERROR: NSIS updater archive (.nsis.zip) or its .sig was not produced by tauri build." >&2
            echo "Confirm bundle.createUpdaterArtifacts is true in tauri config." >&2
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const tag = process.env.RELEASE_TAG;
          const repo = process.env.REPO;
          const archiveName = process.env.UPDATER_ARCHIVE_NAME;
          const sigPath = process.env.UPDATER_SIG_PATH;

          const signature = fs.readFileSync(sigPath, 'utf8').trim();
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = tag || `v${pkg.version}`;
          const url = `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(archiveName)}`;

          const manifest = {
            version,
            notes: 'See the release page for notes.',
            pub_date: new Date().toISOString(),
            platforms: {
              'windows-x86_64': {
                signature,
                url,
              },
            },
          };

          fs.writeFileSync(
            path.join('release-artefacts', 'latest.json'),
            JSON.stringify(manifest, null, 2) + '\n',
          );
          console.log('manifest written for', version, '->', archiveName);
          NODE

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-artefacts/*.msi
            release-artefacts/*.exe
            release-artefacts/*.nsis.zip
            release-artefacts/*.nsis.zip.sig
            release-artefacts/latest.json
