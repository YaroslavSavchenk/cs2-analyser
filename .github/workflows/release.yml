name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows MSI and publish release
    runs-on: windows-latest

    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analyzer/requirements.txt

      - name: Install Python analyzer dependencies
        run: |
          pip install -r analyzer/requirements.txt
          pip install "pyinstaller>=6.3.0"

      - name: Ensure sidecar output directory exists
        shell: bash
        run: mkdir -p src-tauri/binaries

      - name: Build Python analyzer as Tauri sidecar
        run: pyinstaller --onefile --name analyzer-x86_64-pc-windows-msvc --distpath src-tauri/binaries analyzer/main.py

      - name: Build Tauri app (MSI + NSIS + updater artefacts)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Collect release artefacts
        id: collect
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-artefacts
          bundle_root="src-tauri/target/release/bundle"

          echo "--- bundle/msi/ ---"
          ls -la "$bundle_root"/msi/ 2>&1 || true
          echo "--- bundle/nsis/ ---"
          ls -la "$bundle_root"/nsis/ 2>&1 || true

          # Tauri 2.x with bundle.createUpdaterArtifacts: true signs the
          # installers in place: bundle/nsis/*.exe + *.exe.sig and
          # bundle/msi/*.msi + *.msi.sig. There is no .nsis.zip wrapper —
          # the v2 updater consumes the .exe directly (magic-byte sniffed).
          #
          # Rename spaces to dots while copying — GitHub's release-upload
          # normalises asset names the same way ("CS2 Analyser..." becomes
          # "CS2.Analyser..."), and we need the local filename to match the
          # public asset name so the updater URL in latest.json resolves.
          for f in \
            "$bundle_root"/msi/*.msi \
            "$bundle_root"/nsis/*.exe \
            "$bundle_root"/nsis/*.exe.sig ; do
            cp "$f" "release-artefacts/$(basename "$f" | tr ' ' '.')"
          done
          echo "--- release-artefacts/ ---"
          ls -la release-artefacts/

          # Resolve the NSIS installer + its .sig using bash array expansion
          # (NOT `ls`) so nullglob produces an empty array — never a fallback
          # to listing the working directory.
          nsis_exes=(release-artefacts/*.exe)
          nsis_sigs=(release-artefacts/*.exe.sig)
          nsis_exe="${nsis_exes[0]-}"
          nsis_sig="${nsis_sigs[0]-}"
          if [ -z "$nsis_exe" ] || [ -z "$nsis_sig" ]; then
            echo "ERROR: NSIS installer (.exe + .exe.sig) was not produced by tauri build." >&2
            echo "Confirm bundle.createUpdaterArtifacts is true and 'nsis' is in bundle.targets." >&2
            exit 1
          fi
          nsis_exe_name="${nsis_exe##*/}"
          echo "updater_installer_path=$nsis_exe" >> "$GITHUB_OUTPUT"
          echo "updater_sig_path=$nsis_sig" >> "$GITHUB_OUTPUT"
          echo "updater_installer_name=$nsis_exe_name" >> "$GITHUB_OUTPUT"

      - name: Generate updater manifest (latest.json)
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
          REPO: ${{ github.repository }}
          UPDATER_INSTALLER_NAME: ${{ steps.collect.outputs.updater_installer_name }}
          UPDATER_SIG_PATH: ${{ steps.collect.outputs.updater_sig_path }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATER_INSTALLER_NAME" ] || [ -z "$UPDATER_SIG_PATH" ]; then
            echo "ERROR: NSIS installer (.exe) or its .sig was not produced by tauri build." >&2
            echo "Confirm bundle.createUpdaterArtifacts is true in tauri config." >&2
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const tag = process.env.RELEASE_TAG;
          const repo = process.env.REPO;
          const installerName = process.env.UPDATER_INSTALLER_NAME;
          const sigPath = process.env.UPDATER_SIG_PATH;

          const signature = fs.readFileSync(sigPath, 'utf8').trim();
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = tag || `v${pkg.version}`;
          const url = `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(installerName)}`;

          const manifest = {
            version,
            notes: 'See the release page for notes.',
            pub_date: new Date().toISOString(),
            platforms: {
              'windows-x86_64': {
                signature,
                url,
              },
            },
          };

          fs.writeFileSync(
            path.join('release-artefacts', 'latest.json'),
            JSON.stringify(manifest, null, 2) + '\n',
          );
          console.log('manifest written for', version, '->', installerName);
          NODE

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-artefacts/*.msi
            release-artefacts/*.exe
            release-artefacts/latest.json
