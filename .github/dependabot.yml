version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: "/analyzer"
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    labels:
      - dependencies
